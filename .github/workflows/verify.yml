name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: svelte-check
        run: pnpm --dir web check

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Restore lint caches
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules/.cache/eslint
            web/node_modules/.cache/stylelint
          key: lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-
      - name: Lint
        env:
          EIT_DEPRECATED_IMPORTS: "1"
        run: pnpm --dir web lint:all
      - name: Check code formatting
        run: pnpm --dir web format:check
      - name: Check docs formatting
        run: pnpm check:docs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Vitest
        run: pnpm --dir web test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Build
        run: pnpm --dir web build

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Vitest with coverage
        run: pnpm --dir web test:coverage
