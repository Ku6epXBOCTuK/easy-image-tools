name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  e2e:
    name: E2E (non-blocking baseline)
    needs: verify
    # NOTE: on a main push Deploy runs the matrix, so skip here to avoid a second run
    if: github.event_name != 'push'
    uses: ./.github/workflows/e2e.yml
    with:
      advisory: true
