<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				try {
					const saved = localStorage.getItem("theme");
					const theme =
						saved === "dark" || saved === "light"
							? saved
							: matchMedia("(prefers-color-scheme: dark)").matches
								? "dark"
								: "light";
					document.documentElement.dataset.theme = theme;
				} catch {
					document.documentElement.dataset.theme = "light";
				}
			})();
		</script>
		<!--
			NOTE: Above-the-fold faces (EIT-132 font follow-up); the files exist by
			stable names thanks to scripts/gen-fonts.mjs, which runs before build.
		-->
		<link
			rel="preload"
			href="/fonts/ibm-plex-sans-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/ibm-plex-sans-latin-700-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/ibm-plex-mono-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/ibm-plex-mono-latin-500-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
